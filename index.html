<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zero Fast</title>

<link rel="stylesheet" href="style.css">
```

</head>

<body>

```
<!-- Page 1 -->

<div class="page-group active">

    <div class="a4-page cover-page">
    <h1>Zero Fast</h1>
</div>


<!-- Page 2 + Page 3 -->

<div class="page-group">

    <div class="a4-page">
        <h1>Page 2</h1>
    </div>

    <div class="a4-page">
        <h1>Page 3</h1>
    </div>

</div>


<!-- Page 4 + Page 5 -->

<div class="page-group">

    <div class="a4-page">
        <h1>Page 4</h1>
    </div>

    <div class="a4-page">
        <h1>Page 5</h1>
    </div>

</div>


<!-- Page 6 -->

<div class="page-group">

    <div class="a4-page">
        <h1>Page 6</h1>
    </div>

</div>


<!-- Navigation -->

<div class="navigation">

    <button onclick="prevPage()">Previous</button>


    <!-- Contents Dropdown -->

    <div class="contents-dropdown">

        <button class="contents-button" onclick="toggleContents()">
            Contents ▾
        </button>


        <div id="contentsMenu" class="contents-list">

            <button onclick="goToPage(0)">Page 1</button>

            <button onclick="goToPage(1)">Page 2</button>

            <button onclick="goToPage(2)">Page 3</button>

            <button onclick="goToPage(3)">Page 4</button>

            <button onclick="goToPage(4)">Page 5</button>

            <button onclick="goToPage(5)">Page 6</button>

        </div>

    </div>


    <button onclick="nextPage()">Next</button>

</div>


<script>


    let currentPage = 0;


    const groups = document.querySelectorAll('.page-group');

    const allPages = document.querySelectorAll('.a4-page');


    /* =========================
       Device
       ========================= */

    function isMobile() {

        return window.innerWidth <= 600;

    }


    /* =========================
       Computer
       1 → 2+3 → 4+5 → 6
       ========================= */

    function showDesktopPage() {

        groups.forEach(group => {

            group.style.display = '';

            group.classList.remove('active');

        });


        allPages.forEach(page => {

            page.style.display = '';

        });


        groups[currentPage].classList.add('active');

    }


    /* =========================
       Mobile
       1 → 2 → 3 → 4 → 5 → 6
       ========================= */

    function showMobilePage() {

        groups.forEach(group => {

            group.classList.remove('active');

            group.style.display = 'contents';

        });


        allPages.forEach(page => {

            page.style.display = 'none';

        });


        allPages[currentPage].style.display = 'block';

    }


    /* =========================
       Next
       ========================= */

    function nextPage() {

        if (isMobile()) {

            if (currentPage < allPages.length - 1) {

                currentPage++;

                showMobilePage();

            }

        } else {

            if (currentPage < groups.length - 1) {

                currentPage++;

                showDesktopPage();

            }

        }

    }


    /* =========================
       Previous
       ========================= */

    function prevPage() {

        if (isMobile()) {

            if (currentPage > 0) {

                currentPage--;

                showMobilePage();

            }

        } else {

            if (currentPage > 0) {

                currentPage--;

                showDesktopPage();

            }

        }

    }


    /* =========================
       Go To Page
       ========================= */

    function goToPage(pageNumber) {

        currentPage = pageNumber;


        if (isMobile()) {

            showMobilePage();

        } else {

            showDesktopPage();

        }


        closeContents();

    }


    /* =========================
       Contents Dropdown
       ========================= */

    function toggleContents() {

        const menu = document.getElementById('contentsMenu');


        if (menu.style.display === 'flex') {

            menu.style.display = 'none';

        } else {

            menu.style.display = 'flex';

        }

    }


    function closeContents() {

        document.getElementById('contentsMenu').style.display = 'none';

    }


    /* =========================
       Start
       ========================= */

    function setupPages() {

        currentPage = 0;

        closeContents();


        if (isMobile()) {

            showMobilePage();

        } else {

            showDesktopPage();

        }

    }


    setupPages();


    /* =========================
       Touch Navigation
       ========================= */

    let touchStartX = 0;

    let touchStartY = 0;


    document.addEventListener('touchstart', function (event) {

        if (!isMobile()) return;


        if (event.touches.length !== 1) return;


        touchStartX = event.touches[0].clientX;

        touchStartY = event.touches[0].clientY;

    }, { passive: true });


    document.addEventListener('touchend', function (event) {

        if (!isMobile()) return;


        if (event.changedTouches.length !== 1) return;


        const touchEndX = event.changedTouches[0].clientX;

        const touchEndY = event.changedTouches[0].clientY;


        const deltaX = touchEndX - touchStartX;

        const deltaY = touchEndY - touchStartY;


        /* Ignore vertical movement */

        if (Math.abs(deltaY) > Math.abs(deltaX)) {

            return;

        }


        /* Ignore small movement */

        if (Math.abs(deltaX) < 30) {

            return;

        }


        /* Right to left = Previous */

        if (deltaX < 0) {

            prevPage();

        }


        /* Left to right = Next */

        else {

            nextPage();

        }

    }, { passive: true });


</script>
```

</body>

</html>

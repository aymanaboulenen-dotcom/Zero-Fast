<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zero Fast</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- الشاشة 1 : صفحة 1 مستقلة -->
    <div class="page-group active">

        <div class="a4-page">
            <h1>Page 1</h1>
        </div>

    </div>


    <!-- الشاشة 2 : الصفحتان 2 + 3 -->
    <div class="page-group">

        <div class="a4-page">
            <h1>Page 2</h1>
        </div>

        <div class="a4-page">
            <h1>Page 3</h1>
        </div>

    </div>


    <!-- الشاشة 3 : الصفحتان 4 + 5 -->
    <div class="page-group">

        <div class="a4-page">
            <h1>Page 4</h1>
        </div>

        <div class="a4-page">
            <h1>Page 5</h1>
        </div>

    </div>


    <!-- الشاشة 4 : صفحة 6 مستقلة -->
    <div class="page-group">

        <div class="a4-page">
            <h1>Page 6</h1>
        </div>

    </div>


    <!-- أزرار التنقل -->
<div class="navigation">
    <button onclick="prevPage()">السابق</button>
    <button>الفهرس</button>
    <button onclick="nextPage()">التالي</button>
</div>

<script>
let currentPage = 0;

const pages = document.querySelectorAll('.page-group');

function nextPage() {
    if (currentPage < pages.length - 1) {
        pages[currentPage].classList.remove('active');
        currentPage++;
        pages[currentPage].classList.add('active');
    }
}

function prevPage() {
    if (currentPage > 0) {
        pages[currentPage].classList.remove('active');
        currentPage--;
        pages[currentPage].classList.add('active');
    }
}
</script>
</body>
</html>

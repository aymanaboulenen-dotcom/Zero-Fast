<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zero Fast</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- الشاشة 1 : Page 1 -->

    <div class="page-group active">

        <div class="a4-page">
            <h1>Page 1</h1>
        </div>

    </div>


    <!-- الشاشة 2 : Page 2 + Page 3 -->

    <div class="page-group">

        <div class="a4-page">
            <h1>Page 2</h1>
        </div>

        <div class="a4-page">
            <h1>Page 3</h1>
        </div>

    </div>


    <!-- الشاشة 3 : Page 4 + Page 5 -->

    <div class="page-group">

        <div class="a4-page">
            <h1>Page 4</h1>
        </div>

        <div class="a4-page">
            <h1>Page 5</h1>
        </div>

    </div>


    <!-- الشاشة 4 : Page 6 -->

    <div class="page-group">

        <div class="a4-page">
            <h1>Page 6</h1>
        </div>

    </div>


    <!-- أزرار التنقل -->

    <div class="navigation">

        <button onclick="prevPage()">Previous</button>

        <button>Contents</button>

        <button onclick="nextPage()">Next</button>

    </div>


    <script>

        let currentPage = 0;

        const pages = document.querySelectorAll('.page-group');


        function isMobile() {

            return window.innerWidth <= 600;

        }


        function nextPage() {

            if (isMobile()) {

                const allPages = document.querySelectorAll('.a4-page');

                let currentVisible = document.querySelector('.a4-page.mobile-active');

                let currentIndex = currentVisible
                    ? Array.from(allPages).indexOf(currentVisible)
                    : 0;

                if (currentIndex < allPages.length - 1) {

                    document.querySelectorAll('.a4-page').forEach(page => {
                        page.classList.remove('mobile-active');
                    });

                    allPages[currentIndex + 1].classList.add('mobile-active');

                }

            } else {

                if (currentPage < pages.length - 1) {

                    pages[currentPage].classList.remove('active');

                    currentPage++;

                    pages[currentPage].classList.add('active');

                }

            }

        }


        function prevPage() {

            if (isMobile()) {

                const allPages = document.querySelectorAll('.a4-page');

                let currentVisible = document.querySelector('.a4-page.mobile-active');

                let currentIndex = currentVisible
                    ? Array.from(allPages).indexOf(currentVisible)
                    : 0;

                if (currentIndex > 0) {

                    document.querySelectorAll('.a4-page').forEach(page => {
                        page.classList.remove('mobile-active');
                    });

                    allPages[currentIndex - 1].classList.add('mobile-active');

                }

            } else {

                if (currentPage > 0) {

                    pages[currentPage].classList.remove('active');

                    currentPage--;

                    pages[currentPage].classList.add('active');

                }

            }

        }


        function setupMobile() {

            if (isMobile()) {

                const allPages = document.querySelectorAll('.a4-page');

                document.querySelectorAll('.page-group').forEach(group => {
                    group.classList.remove('active');
                });

                allPages.forEach(page => {
                    page.classList.remove('mobile-active');
                });

                allPages[0].classList.add('mobile-active');

            }

        }


        setupMobile();


        window.addEventListener('resize', setupMobile);

    </script>


</body>

</html>

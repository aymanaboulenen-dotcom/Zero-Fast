<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zero Fast</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- Page 1 -->

    <div class="page-group active">

        <div class="a4-page">
            <h1>Page 1</h1>
        </div>

    </div>


    <!-- Page 2 + Page 3 -->

    <div class="page-group">

        <div class="a4-page">
            <h1>Page 2</h1>
        </div>

        <div class="a4-page">
            <h1>Page 3</h1>
        </div>

    </div>


    <!-- Page 4 + Page 5 -->

    <div class="page-group">

        <div class="a4-page">
            <h1>Page 4</h1>
        </div>

        <div class="a4-page">
            <h1>Page 5</h1>
        </div>

    </div>


    <!-- Page 6 -->

    <div class="page-group">

        <div class="a4-page">
            <h1>Page 6</h1>
        </div>

    </div>


    <!-- Navigation -->

    <div class="navigation">

        <button onclick="prevPage()">Previous</button>

        <button>Contents</button>

        <button onclick="nextPage()">Next</button>

    </div>


    <script>

        let currentPage = 0;

        const groups = document.querySelectorAll('.page-group');

        const allPages = document.querySelectorAll('.a4-page');


        function isMobile() {

            return window.innerWidth <= 600;

        }


        /* =========================
           Computer
           1 → 2+3 → 4+5 → 6
           ========================= */

        function showDesktopPage() {

            groups.forEach(group => {

                group.style.display = '';

                group.classList.remove('active');

            });


            allPages.forEach(page => {

                page.style.display = '';

            });


            groups[currentPage].classList.add('active');

        }


        /* =========================
           Mobile
           1 → 2 → 3 → 4 → 5 → 6
           ========================= */

        function showMobilePage() {

            groups.forEach(group => {

                group.classList.remove('active');

                group.style.display = 'contents';

            });


            allPages.forEach(page => {

                page.style.display = 'none';

            });


            allPages[currentPage].style.display = 'block';

        }


        /* =========================
           Next
           ========================= */

        function nextPage() {

            if (isMobile()) {

                if (currentPage < allPages.length - 1) {

                    currentPage++;

                    showMobilePage();

                }

            } else {

                if (currentPage < groups.length - 1) {

                    currentPage++;

                    showDesktopPage();

                }

            }

        }


        /* =========================
           Previous
           ========================= */

        function prevPage() {

            if (isMobile()) {

                if (currentPage > 0) {

                    currentPage--;

                    showMobilePage();

                }

            } else {

                if (currentPage > 0) {

                    currentPage--;

                    showDesktopPage();

                }

            }

        }


        /* =========================
           Start
           ========================= */

        function setupPages() {

            currentPage = 0;


            if (isMobile()) {

                showMobilePage();

            } else {

                showDesktopPage();

            }

        }


        setupPages();


        /* =========================
           Screen resize
           ========================= */

        window.addEventListener('resize', setupPages);
window.addEventListener('resize', setupPages);


/* =========================
   لمس يمين / يسار الموبايل
   ========================= */

let touchStartX = 0;
let touchStartY = 0;

document.addEventListener('touchstart', function (event) {

    if (!isMobile()) return;

    if (event.touches.length !== 1) return;

    touchStartX = event.touches[0].clientX;
    touchStartY = event.touches[0].clientY;

}, { passive: true });


document.addEventListener('touchend', function (event) {

    if (!isMobile()) return;

    if (event.changedTouches.length !== 1) return;

    const touchEndX = event.changedTouches[0].clientX;
    const touchEndY = event.changedTouches[0].clientY;

    const deltaX = touchEndX - touchStartX;
    const deltaY = touchEndY - touchStartY;

    if (Math.abs(deltaY) > Math.abs(deltaX)) {
        return;
    }

    if (Math.abs(deltaX) < 30) {
        return;
    }

    if (deltaX < 0) {
        nextPage();
    } else {
        prevPage();
    }

});
    </script>


</body>

</html>
